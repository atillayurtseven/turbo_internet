# /etc/nginx/sites-available/turbointernet.com
# Site files live in /var/www/turbointernet
#
# certbot --nginx rewrites both blocks to listen on 443 and to redirect
# port 80 to HTTPS. Run it only once the names resolve, or the challenge
# fails and no certificate is issued.

# www exists only to send people to the bare domain. Keeping one canonical
# address matters here: the Chrome Web Store listing carries /privacy, and
# two addresses answering the same content invites the wrong one being used.
server {
    listen 80;
    listen [::]:80;
    server_name www.turbointernet.com;
    return 301 http://turbointernet.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name turbointernet.com;

    root /var/www/turbointernet;
    index index.html;

    # A stable address, independent of the file behind it: this is the URL
    # given to the Chrome Web Store, and a dead policy URL means rejection.
    location = /privacy {
        try_files /privacy.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
