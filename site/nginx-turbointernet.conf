# /etc/nginx/sites-available/turbointernet.com
# Site files go in /var/www/turbointernet
#
# Certbot rewrites this file when TLS is issued; run it after the DNS
# records resolve, or the challenge fails.

server {
    listen 80;
    listen [::]:80;
    server_name turbointernet.com www.turbointernet.com;

    root /var/www/turbointernet;
    index index.html;

    # /privacy is the address given to the Chrome Web Store, so it is kept
    # stable and independent of the file name behind it.
    location = /privacy {
        try_files /privacy.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
