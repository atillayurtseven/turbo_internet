# /etc/nginx/sites-available/turbointernet.com
# Site files live in /var/www/turbointernet
#
# certbot --nginx rewrites both blocks to listen on 443 and to redirect
# port 80 to HTTPS. Run it only once the names resolve, or the challenge
# fails and no certificate is issued.

# www exists only to send people to the bare domain. Keeping one canonical
# address matters here: the Chrome Web Store listing carries /privacy, and
# two addresses answering the same content invites the wrong one being used.
server {
    listen 80;
    listen [::]:80;
    server_name www.turbointernet.com;
    return 301 https://turbointernet.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name turbointernet.com;

    root /var/www/turbointernet;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/ld+json image/svg+xml;

    # A stable address, independent of the file behind it: this is the URL
    # given to the Chrome Web Store, and a dead policy URL means rejection.
    location = /privacy {
        try_files /privacy.html =404;
    }

    # The root is served through try_files rather than `index index.html`.
    # `index` performs an internal redirect to /index.html, which re-enters
    # location matching and turns the redirect below into a loop on "/".
    location = / {
        try_files /index.html =404;
    }

    # One canonical URL per page. Both files answer directly otherwise, which
    # splits whatever authority the two pages accumulate.
    location = /index.html   { return 301 https://turbointernet.com/; }
    location = /privacy.html { return 301 https://turbointernet.com/privacy; }

    location = /favicon.ico { access_log off; log_not_found off; }

    # nginx inherits add_header from an outer level ONLY when the inner level
    # declares none of its own. Every location below that sets one header must
    # therefore repeat the security headers, or it silently loses all of them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # HTML always revalidates. Without this an intermediary may cache the
    # landing page heuristically from Last-Modified and serve it stale.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    # robots.txt, sitemap.xml, llms.txt: short cache, never the asset 7 days.
    location ~* \.(txt|xml)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(css|js|png|jpe?g|svg|ico|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
