<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="logo">⬇</div>
      <div class="titles">
        <div class="name" data-i18n="app.name"></div>
        <div class="tagline" id="tagline"></div>
      </div>
      <button id="settings" class="icon" data-i18n-attr="title:action.settings">⚙</button>
    </header>

    <main id="list" class="list"></main>

    <footer class="foot">
      <span id="queue"></span>
      <span id="today"></span>
      <button id="clear" data-i18n="action.clearCompleted"></button>
    </footer>

    <template id="row-template">
      <article class="dl">
        <div class="head">
          <div class="badge"></div>
          <div class="meta">
            <div class="filename"></div>
            <div class="info"></div>
          </div>
        </div>
        <div class="bar"></div>
        <div class="actions"></div>
      </article>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
