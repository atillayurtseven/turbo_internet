<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1400px;height:560px;overflow:hidden}
body{display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box;
  background:linear-gradient(135deg,#0d1220 0%,#161a2b 55%,#1d1533 100%);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#e6e9ef}
/* Akan seritler: es zamanli birden cok baglantiyi cagristiriyor */
.streaks{position:absolute;inset:0;overflow:hidden}
.streaks i{position:absolute;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(91,155,255,0) 0%,rgba(91,155,255,.55) 45%,rgba(139,92,246,0) 100%)}
img{width:96px;height:96px;border-radius:24px;margin-bottom:30px;position:relative}
h1{font-size:56px;line-height:1.2;margin:0 0 18px;letter-spacing:-.015em;position:relative}
p{font-size:22px;color:#9aa3b2;margin:0;position:relative}
</style></head><body>
<div class="streaks">
  <i style="top:38px;left:-8%;width:70%"></i>
  <i style="top:96px;left:22%;width:86%"></i>
  <i style="top:158px;left:-14%;width:62%"></i>
  <i style="top:216px;left:34%;width:78%"></i>
  <i style="top:252px;left:6%;width:54%"></i>
</div>

</body></html>
